{% extends "base.html" %}
{% block title %}Требования задания{% endblock %}

{% block content %}
<h1>Требования задания</h1>

{% for b in blocks %}
  <section class="card">
    <h2>{{ b.title }}</h2>
    <ul>
      {% for item in b.items %}
        <li>{{ item }}</li>
      {% endfor %}
    </ul>
  </section>
{% endfor %}

{% endblock %}
