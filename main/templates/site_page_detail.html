{% extends "base.html" %}
{% block title %}{{ page.title }}{% endblock %}

{% block content %}
<article class="card">
  <h1>{{ page.title }}</h1>
  <p><b>Категория:</b> {{ page.category }}</p>
  <p><b>Обновлено:</b> {{ page.updated_at|date:"d.m.Y H:i" }}</p>

  <div>
    {{ page.content|linebreaks }}
  </div>

  <p><a href="{% url 'site_pages' %}">Назад к списку страниц</a></p>
</article>
{% endblock %}
